
<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccd0df;
        }

        h1 {
            text-align: center;
            color: #3730a3;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        li {
            background: #f3f4f6;
            margin-top: 12px;
            padding: 12px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        li a {
            float: right;
            color: #dc2626;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>

        <form action="/add" method="POST">
            <input type="text" name="task"
                   placeholder="Enter a new task..."
                   required>
            <button type="submit">Add</button>
        </form>

        <ul>
            {% for task in tasks %}
            <li>
                {{ task[1] }}
                <a href="/delete/{{ task[0] }}">Delete</a>
            </li>


            <h1> hiiiii</h1>
            {% else %}
            <p>No tasks yet. Add your first task!</p>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
